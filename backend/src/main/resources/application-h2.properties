spring.application.name=speakeasy-backend
server.port=8085

spring.datasource.url=jdbc:h2:mem:speakeasydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

speakeasy.jwt.expiration-ms=86400000
speakeasy.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

speakeasy.reward.sentence-xp=10
speakeasy.reward.improved-repeat-xp=5
speakeasy.reward.topic-talk-xp=20
speakeasy.reward.interview-answer-xp=30
speakeasy.reward.drill-correct-xp=5
speakeasy.reward.checkin-xp=3
speakeasy.reward.filler-free-bonus=5
speakeasy.reward.streak-bonus-per-day=2
speakeasy.reward.streak-bonus-cap=20
speakeasy.ai.api-key=${LLM_API_KEY:}
